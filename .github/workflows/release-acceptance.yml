name: Release Acceptance

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable GitHub release tag to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  install-and-updater-smoke:
    name: ${{ matrix.os }} published release acceptance
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Checkout current acceptance tooling
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Linux smoke prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            dbus-x11 \
            libfuse2 \
            xvfb

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" --dir release-smoke --clobber

      - name: Install release and verify updater hop
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/smoke_tauri_release_install.mjs
          --assets-dir release-smoke
          --release-tag "${{ inputs.tag }}"
