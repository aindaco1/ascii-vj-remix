name: Release Desktop Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to build and publish
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

jobs:
  release-context:
    name: Resolve immutable release context
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    outputs:
      matrix: ${{ steps.context.outputs.matrix }}
      release_sha: ${{ steps.context.outputs.release_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Read and validate release version
        id: version
        run: node scripts/check_release_version.mjs --github-output

      - name: Pin release commit and platform matrix
        id: context
        shell: bash
        run: |
          if [ "$RELEASE_TAG" != "${{ steps.version.outputs.tag }}" ]; then
            echo "Release tag $RELEASE_TAG does not match version tag ${{ steps.version.outputs.tag }}."
            exit 1
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo 'matrix={"include":[{"os":"macos-26","platform":"macos-aarch64","binary":"ascii-vj-remix"},{"os":"windows-latest","platform":"windows-x86_64","binary":"ascii-vj-remix.exe"},{"os":"ubuntu-24.04","platform":"linux-x86_64","binary":"ascii-vj-remix"}]}' >> "$GITHUB_OUTPUT"

  source-acceptance:
    name: Require exact Desktop CI success
    needs: release-context
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Accept exact main-push Desktop CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/require_github_workflow_success.mjs
          --repository "${{ github.repository }}"
          --workflow desktop.yml
          --commit "${{ needs.release-context.outputs.release_sha }}"
          --branch main
          --event push

  build-runtime:
    name: Build ${{ matrix.platform }} FFmpeg runtime
    needs: release-context
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      HOMEBREW_NO_REQUIRE_TAP_TRUST: '1'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-context.outputs.matrix) }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux FFmpeg build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            nasm \
            xz-utils \
            yasm

      - name: Install macOS FFmpeg build prerequisites
        if: runner.os == 'macOS'
        run: brew list --formula nasm >/dev/null 2>&1 || brew install --formula nasm

      - name: Install Windows FFmpeg build prerequisites
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            base-devel
            diffutils
            curl
            tar
            xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-yasm

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build FFmpeg sidecar
        if: runner.os != 'Windows'
        shell: bash
        run: npm run ffmpeg:build-sidecar

      - name: Build FFmpeg sidecar
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          ASCILINE_FFMPEG_BUILD_DIR: /tmp/asciline-ffmpeg
        run: npm run ffmpeg:build-sidecar

      - name: Verify FFmpeg release runtime
        run: npm run check:release-runtime

      - name: Upload verified FFmpeg runtime
        uses: actions/upload-artifact@v7
        with:
          name: release-runtime-${{ matrix.platform }}-${{ needs.release-context.outputs.release_sha }}
          path: src-tauri/resources/ffmpeg/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-binary:
    name: Build ${{ matrix.platform }} app binary
    needs: release-context
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      CARGO_NET_RETRY: '10'
      CARGO_HTTP_MULTIPLEXING: 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-context.outputs.matrix) }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Linux Tauri build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Compile release app without bundling
        run: npm run tauri:build -- --no-bundle --ci

      - name: Pack verified release binary
        shell: bash
        run: >-
          node scripts/tauri_release_binary.mjs pack
          --binary "src-tauri/target/release/${{ matrix.binary }}"
          --output-dir "$RUNNER_TEMP/tauri-release-binary"
          --commit "${{ needs.release-context.outputs.release_sha }}"
          --platform "${{ matrix.platform }}"
          --version "${{ needs.release-context.outputs.version }}"

      - name: Upload verified release binary
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-${{ matrix.platform }}-${{ needs.release-context.outputs.release_sha }}
          path: ${{ runner.temp }}/tauri-release-binary
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  bundle:
    name: Bundle ${{ matrix.platform }}
    needs:
      - release-context
      - source-acceptance
      - build-runtime
      - build-binary
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      HOMEBREW_NO_REQUIRE_TAP_TRUST: '1'
      CARGO_NET_RETRY: '10'
      CARGO_HTTP_MULTIPLEXING: 'false'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-context.outputs.matrix) }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout release tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          path: .release-tooling

      - name: Install Linux Tauri bundling prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libfuse2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download verified FFmpeg runtime
        uses: actions/download-artifact@v8
        with:
          name: release-runtime-${{ matrix.platform }}-${{ needs.release-context.outputs.release_sha }}
          path: src-tauri/resources/ffmpeg/${{ matrix.platform }}

      - name: Download verified release binary
        uses: actions/download-artifact@v8
        with:
          name: release-binary-${{ matrix.platform }}-${{ needs.release-context.outputs.release_sha }}
          path: ${{ runner.temp }}/tauri-release-binary

      - name: Restore Unix FFmpeg executable permissions
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # Zipped Actions artifacts restore files as 0644. The camera-input
          # gate must execute these two verified tools before bundling.
          chmod 755 "src-tauri/resources/ffmpeg/${{ matrix.platform }}/bin/ffmpeg" \
            "src-tauri/resources/ffmpeg/${{ matrix.platform }}/bin/ffprobe"

      - name: Restore exact release binary
        shell: bash
        run: >-
          node scripts/tauri_release_binary.mjs restore
          --input-dir "$RUNNER_TEMP/tauri-release-binary"
          --output "src-tauri/target/release/${{ matrix.binary }}"
          --commit "${{ needs.release-context.outputs.release_sha }}"
          --platform "${{ matrix.platform }}"
          --version "${{ needs.release-context.outputs.version }}"

      - name: Verify release package inputs
        run: |
          npm run release:version:check
          npm run check:release-runtime

      - name: Verify updater signing secret
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY GitHub secret is required for signed updater artifacts."
            exit 1
          fi

      - name: Select macOS signing mode
        id: macos_signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          ASCILINE_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          ASCILINE_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$ASCILINE_APPLE_CERTIFICATE" ]; then
            echo "APPLE_CERTIFICATE is required for public macOS releases."
            exit 1
          fi

          if [ -z "$ASCILINE_APPLE_CERTIFICATE_PASSWORD" ]; then
            echo "APPLE_CERTIFICATE_PASSWORD is required when APPLE_CERTIFICATE is set."
            exit 1
          fi

          if [ -z "$KEYCHAIN_PASSWORD" ]; then
            echo "KEYCHAIN_PASSWORD is required when APPLE_CERTIFICATE is set."
            exit 1
          fi

          if [ -n "$APPLE_API_KEY_P8" ]; then
            if [ -z "$APPLE_API_KEY" ] || [ -z "$APPLE_API_ISSUER" ]; then
              echo "APPLE_API_KEY and APPLE_API_ISSUER are required with APPLE_API_KEY_P8."
              exit 1
            fi
            api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$api_key_path"
            chmod 600 "$api_key_path"
            {
              printf 'APPLE_NOTARIZATION_AUTH=api-key\n'
              printf 'APPLE_API_KEY=%s\n' "$APPLE_API_KEY"
              printf 'APPLE_API_ISSUER=%s\n' "$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          elif [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "Notarization requires either APPLE_API_KEY/APPLE_API_ISSUER/APPLE_API_KEY_P8 or APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID."
            exit 1
          else
            {
              printf 'APPLE_NOTARIZATION_AUTH=apple-id\n'
              printf 'APPLE_ID=%s\n' "$APPLE_ID"
              printf 'APPLE_PASSWORD=%s\n' "$APPLE_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/asciline-release.keychain-db"
          printf '%s' "$ASCILINE_APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -t 3600 -u "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$ASCILINE_APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          cert_info="$(security find-identity -v -p codesigning "$keychain_path" | grep "Developer ID Application" | head -1 || true)"
          cert_id="$(echo "$cert_info" | awk -F'"' '{print $2}')"
          if [ -z "$cert_id" ]; then
            echo "No Developer ID Application identity was found in the imported certificate."
            exit 1
          fi
          cert_team_id="$(printf '%s\n' "$cert_id" | sed -E 's/.*\(([A-Z0-9]{3,})\).*/\1/')"
          if [ "$cert_team_id" = "$cert_id" ]; then
            cert_team_id=""
          fi
          team_id="${APPLE_TEAM_ID:-$cert_team_id}"
          if [ "${#team_id}" -lt 3 ]; then
            echo "APPLE_TEAM_ID is required for notarization and could not be derived from the Developer ID certificate."
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$team_id" >> "$GITHUB_ENV"

          echo "notarize=true" >> "$GITHUB_OUTPUT"
          echo "Using Developer ID signing and notarization for macOS."

      - name: Verify macOS notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ "$APPLE_NOTARIZATION_AUTH" = "api-key" ]; then
            xcrun notarytool history \
              --key "$APPLE_API_KEY_PATH" \
              --key-id "$APPLE_API_KEY" \
              --issuer "$APPLE_API_ISSUER" \
              --output-format json >/dev/null
          elif [ "$APPLE_NOTARIZATION_AUTH" = "apple-id" ]; then
            xcrun notarytool history \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json >/dev/null
          else
            echo "APPLE_NOTARIZATION_AUTH was not selected by the signing setup step."
            exit 1
          fi

      - name: Sign macOS FFmpeg sidecars
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tooling_script="scripts/sign_macos_ffmpeg_sidecars.mjs"
          if [ ! -f "$tooling_script" ]; then
            tooling_script=".release-tooling/scripts/sign_macos_ffmpeg_sidecars.mjs"
          fi
          node "$tooling_script"

      - name: Verify signed macOS FFmpeg sidecars
        if: runner.os == 'macOS'
        run: npm run check:ffmpeg-release

      - name: Bundle notarized macOS app
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- bundle --config src-tauri/tauri.notarized.conf.json --ci

      - name: Notarize macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tooling_script="scripts/notarize_macos_dmg.mjs"
          if [ ! -f "$tooling_script" ]; then
            tooling_script=".release-tooling/scripts/notarize_macos_dmg.mjs"
          fi
          node "$tooling_script" --profile release

      - name: Bundle Linux desktop app
        if: runner.os == 'Linux'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- bundle --ci

      - name: Bundle unsigned Windows preview app
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- bundle --ci

      - name: Verify desktop bundle contents
        run: npm run check:bundle:release

      - name: Verify Windows GUI subsystem
        if: runner.os == 'Windows'
        run: npm run check:windows-gui

      - name: Verify macOS notarization
        if: runner.os == 'macOS'
        shell: bash
        run: |
          tooling_script="scripts/check_macos_notarization.mjs"
          if [ -f ".release-tooling/scripts/check_macos_notarization.mjs" ]; then
            tooling_script=".release-tooling/scripts/check_macos_notarization.mjs"
          fi
          node "$tooling_script" --profile release

      - name: Collect release assets
        run: node scripts/collect_tauri_release_assets.mjs --profile release

      - name: Create updater fragment
        run: node scripts/create_tauri_update_fragment.mjs --profile release --repo "${{ github.repository }}" --tag "${{ env.RELEASE_TAG }}" --out "src-tauri/target/release/release-assets/updater-fragment-${{ runner.os }}-${{ runner.arch }}.json"

      - name: Upload desktop release assets
        uses: actions/upload-artifact@v7
        with:
          name: ascii-vj-remix-${{ runner.os }}-${{ runner.arch }}
          path: src-tauri/target/release/release-assets/*
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download platform assets
        uses: actions/download-artifact@v8
        with:
          pattern: ascii-vj-remix-*
          path: release-artifacts

      - name: Merge updater metadata
        run: node scripts/merge_tauri_update_fragments.mjs --fragments-dir release-artifacts --out release-artifacts/latest.json

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "ASCII VJ Remix $RELEASE_TAG" --notes "ASCII VJ Remix desktop release $RELEASE_TAG"
          fi

          mapfile -d '' ASSETS < <(find release-artifacts -type f \
            ! -name 'updater-fragment-*.json' \
            ! -name '.DS_Store' \
            -print0)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${ASSETS[@]}"

  install-and-updater-smoke:
    name: ${{ matrix.os }} install and updater smoke
    needs: publish-github-release
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - windows-latest
          - ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}

      - name: Checkout current release acceptance tooling
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          path: .release-tooling

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Linux smoke prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            dbus-x11 \
            libfuse2 \
            xvfb

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ env.RELEASE_TAG }}" --dir release-smoke --clobber

      - name: Install release and verify updater hop
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          node .release-tooling/scripts/smoke_tauri_release_install.mjs
          --assets-dir release-smoke
          --release-tag "${{ env.RELEASE_TAG }}"
