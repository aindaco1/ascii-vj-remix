name: Desktop

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-and-tauri:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # `apple-metal` in the native wgpu stack needs the macOS 26 Metal SDK.
          - macos-26
          - windows-latest
          - ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            librsvg2-dev \
            nasm \
            patchelf \
            libssl-dev \
            xz-utils \
            yasm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Verify desktop build
        run: npm run check:desktop

      - name: Verify Windows preset renderer matrix
        if: runner.os == 'Windows'
        run: node scripts/smoke_static_pages.mjs

      - name: Install Windows FFmpeg build prerequisites
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            base-devel
            diffutils
            curl
            tar
            xz
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-yasm

      - name: Build verified Windows FFmpeg sidecars
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        shell: msys2 {0}
        env:
          ASCILINE_FFMPEG_BUILD_DIR: /tmp/asciline-ffmpeg
        run: npm run ffmpeg:build-sidecar

      - name: Build verified Linux FFmpeg sidecars
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        shell: bash
        run: npm run ffmpeg:build-sidecar

      - name: Build unsigned Windows test installer
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        run: npm run bundle:test

      - name: Upload unsigned Windows test installer
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ascii-vj-remix-windows-test-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Build unsigned Linux test packages
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: npm run bundle:test:linux

      - name: Upload unsigned Linux test packages
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ascii-vj-remix-linux-test-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
